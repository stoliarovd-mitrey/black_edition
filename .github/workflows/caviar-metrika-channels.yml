name: Caviar Metrica distinct channel audience
on:
  workflow_dispatch:
  push:
    paths:
      - 'metrika-pipeline/channels.run'
permissions:
  contents: read
concurrency:
  group: caviar-metrika-channel-sync
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check period, domains and unique-user logic
        run: python -m unittest discover -s metrika-pipeline -p 'test_*.py' -v
      - name: Install Google and HTTP dependencies
        run: python -m pip install --disable-pip-version-check google-auth requests
      - name: Read Metrica into private workbook
        env:
          YANDEX_METRIKA_TOKEN: ${{ secrets.YANDEX_METRIKA_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
          GA4_SHEET_ID: ${{ vars.GA4_SHEET_ID }}
        run: python metrika-pipeline/channels.py
