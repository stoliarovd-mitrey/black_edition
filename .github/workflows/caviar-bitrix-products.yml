name: Caviar Bitrix24 product rows to private Google Sheets
on:
  schedule:
    - cron: "30 4 * * *" # 07:30 Europe/Moscow (UTC+3)
  workflow_dispatch:
  push:
    paths:
      - "bitrix-pipeline/.products-run"
concurrency:
  group: caviar-bitrix-products-sync
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  export-products:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests google-auth
      - name: Export deal products for cvr/glb only
        env:
          BITRIX24_WEBHOOK_URL: ${{ secrets.BITRIX24_WEBHOOK_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
          GA4_SHEET_ID: ${{ vars.GA4_SHEET_ID }}
          BITRIX_PRODUCTS_MAX_DEALS: "1200"
        run: |
          test -n "$BITRIX24_WEBHOOK_URL"
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON"
          test -n "$GA4_SHEET_ID"
          python bitrix-pipeline/sync_products.py
