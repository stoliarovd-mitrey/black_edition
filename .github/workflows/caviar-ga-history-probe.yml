name: Caviar historical GA data recovery
on:
  push:
    paths:
      - '.github/workflows/caviar-ga-history-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check google-auth requests
      - name: Read historical GA data into private workbook
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
          GA4_SHEET_ID: ${{ vars.GA4_SHEET_ID }}
        shell: python
        run: |
          """Read historical GA reports into the existing private data workbook."""
          import os,json,time,concurrent.futures
          from datetime import datetime,timezone
          from urllib.parse import quote
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession
          info=json.loads(os.environ['GOOGLE_SERVICE_ACCOUNT_JSON'])
          def session():return AuthorizedSession(service_account.Credentials.from_service_account_info(info,scopes=['https://www.googleapis.com/auth/analytics.readonly','https://www.googleapis.com/auth/spreadsheets']))
          def request(s,method,url,**kw):
           for attempt in range(3):
            try:
             r=s.request(method,url,timeout=55,**kw)
             if r.ok:return r.json()
             if r.status_code not in (429,500,502,503,504):return {'_error':r.status_code,'detail':r.json()}
            except Exception as e:
             if attempt==2:return {'_error':type(e).__name__}
            time.sleep(2)
           return {'_error':'retry-exhausted'}
          S=session();base='https://sheets.googleapis.com/v4/spreadsheets/'+os.environ['GA4_SHEET_ID']
          access=request(S,'GET',base+'/values/GA_History_Access!A1:D30').get('values',[])
          pids=[r[1].split('/')[1] for r in access[1:] if r[1].startswith('properties/') and r[2]=='200']
          rows=[['propertyId','year','report','dimensions','metrics','metadata']];checks=[['atUTC','propertyId','year','report','status','rows']];streams=[['propertyId','metadataJSON']]
          def query(task):
           pid,year,name,dims,metrics,regex=task;s=session();offset=0;out=[]
           while True:
            body={'dateRanges':[{'startDate':f'{year}-09-01','endDate':f'{year}-11-12'}],'dimensions':[{'name':v} for v in dims],'metrics':[{'name':v} for v in metrics],'limit':'10000','offset':str(offset)}
            if regex:body['dimensionFilter']={'filter':{'fieldName':'hostName','stringFilter':{'matchType':'FULL_REGEXP','value':regex,'caseSensitive':False}}}
            d=request(s,'POST',f'https://analyticsdata.googleapis.com/v1beta/properties/{pid}:runReport',json=body)
            if '_error' in d:return out,[datetime.now(timezone.utc).isoformat(),pid,year,name,json.dumps(d),len(out)]
            for r in d.get('rows',[]):out.append([pid,year,name,json.dumps(dict(zip(dims,[v['value'] for v in r.get('dimensionValues',[])])),ensure_ascii=False),json.dumps(dict(zip(metrics,[v['value'] for v in r['metricValues']]))),json.dumps(d.get('metadata',{}))])
            offset+=len(d.get('rows',[]))
            if not d.get('rows') or offset>=d.get('rowCount',0):return out,[datetime.now(timezone.utc).isoformat(),pid,year,name,'OK' if out else 'NO_DATA',len(out)]
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
           tasks=[(p,y,'hostname',['hostName'],['totalUsers','sessions'],None) for p in pids for y in [2024,2025]]
           for out,check in pool.map(query,tasks):rows.extend(out);checks.append(check)
          for pid in pids:
           d=request(S,'GET',f'https://analyticsadmin.googleapis.com/v1beta/properties/{pid}/dataStreams?pageSize=200')
           streams.append([pid,json.dumps(d,ensure_ascii=False)[:45000]])
          # Export full matching-domain reports, including the original Russian resource.
          matching=set()
          for p,y,n,d,m,meta in rows[1:]:
           host=json.loads(d).get('hostName','').lower()
           if host in ('caviar.global','www.caviar.global','caviar-phone.ru','www.caviar-phone.ru','caviar-phones.ru','www.caviar-phones.ru'):matching.add((p,y,'global' if 'global' in host else 'ru'))
          tasks=[]
          for p,y,market in sorted(matching):
           regex=r'(^|\.)caviar-phones?\.ru$' if market=='ru' else r'(^|\.)caviar\.global$'
           for name,dims,metrics in [('total',[],['totalUsers','activeUsers','sessions','engagedSessions','engagementRate','keyEvents','screenPageViews']),('sources',['sessionSourceMedium','sessionDefaultChannelGroup'],['totalUsers','sessions','engagedSessions','keyEvents']),('daily',['date'],['totalUsers','sessions','engagedSessions','keyEvents'])]:tasks.append((p,y,market+'_'+name,dims,metrics,regex))
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
           for out,check in pool.map(query,tasks):rows.extend(out);checks.append(check)
          meta=request(S,'GET',base,params={'fields':'sheets(properties(sheetId,title,gridProperties))'});exists={s['properties']['title']:s['properties'] for s in meta['sheets']}
          for title,values in {'GA_History_Probe':rows,'GA_History_Checks':checks,'GA_History_Streams':streams}.items():
           if title not in exists:r=request(S,'POST',base+':batchUpdate',json={'requests':[{'addSheet':{'properties':{'title':title,'gridProperties':{'rowCount':len(values)+100,'columnCount':6,'frozenRowCount':1}}}}]})
           else:
            if exists[title]['gridProperties']['rowCount']<len(values):request(S,'POST',base+':batchUpdate',json={'requests':[{'updateSheetProperties':{'properties':{'sheetId':exists[title]['sheetId'],'gridProperties':{'rowCount':len(values)+100}},'fields':'gridProperties.rowCount'}}]})
            request(S,'POST',base+'/values/'+quote(title+'!A:F',safe='')+':clear',json={})
           for i in range(0,len(values),400):
            result=request(S,'POST',base+'/values:batchUpdate',json={'valueInputOption':'RAW','data':[{'range':title+'!A'+str(i+1),'values':values[i:i+400]}]})
            if '_error' in result:raise RuntimeError('Private workbook write failed')
          print('Historical GA reports and checks saved privately.')
