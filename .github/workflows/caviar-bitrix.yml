name: Caviar Bitrix24 CRM to private Google Sheets
on:
  schedule:
    - cron: "50 3 * * *" # 06:50 Moscow daily, before 08:30 report
  workflow_dispatch:
  push:
    paths:
      - "bitrix-pipeline/.run"
concurrency:
  group: caviar-bitrix-sync
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  export-crm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests google-auth phonenumbers
      - name: Fetch read-only CRM data and store privately
        env:
          BITRIX24_WEBHOOK_URL: ${{ secrets.BITRIX24_WEBHOOK_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
          GA4_SHEET_ID: ${{ vars.GA4_SHEET_ID }}
          BITRIX_START_DATE: "2023-01-01"
          BITRIX_REFRESH_DAYS: "60"
        run: |
          test -n "$BITRIX24_WEBHOOK_URL" || (echo "Missing BITRIX24_WEBHOOK_URL secret" && exit 1)
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON" || (echo "Missing GA4_SERVICE_ACCOUNT_JSON secret" && exit 1)
          test -n "$GA4_SHEET_ID" || (echo "Missing GA4_SHEET_ID variable" && exit 1)
          python -m py_compile bitrix-pipeline/sync_bitrix.py
          python bitrix-pipeline/sync_bitrix.py
