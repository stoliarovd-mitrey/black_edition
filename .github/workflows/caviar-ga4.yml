name: Caviar GA4 to private Google Sheets
on:
  schedule:
    - cron: "15 4 * * *" # 07:15 Moscow (UTC+3), every day
  workflow_dispatch:
  push:
    paths:
      - 'ga4-pipeline/.run'
concurrency:
  group: caviar-ga4-sheet-sync
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  export-ga4:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal dependencies
        run: python -m pip install --disable-pip-version-check google-auth requests
      - name: Export GA4 (no private data in GitHub)
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
          GA4_SHEET_ID: ${{ vars.GA4_SHEET_ID }}
          GA4_BOOTSTRAP_START: "2026-06-24"
          GA4_REFRESH_DAYS: "35"
        run: |
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON" || (echo "Missing GA4_SERVICE_ACCOUNT_JSON secret" && exit 1)
          test -n "$GA4_SHEET_ID" || (echo "Missing GA4_SHEET_ID variable" && exit 1)
          python ga4-pipeline/sync_ga4.py
