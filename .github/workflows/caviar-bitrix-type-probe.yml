name: Caviar CRM type-field discovery
on:
  workflow_dispatch:
  push:
    paths:
      - "bitrix-pipeline/.type-probe"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests google-auth
      - name: Read field labels and options (no client records)
        env:
          BITRIX24_WEBHOOK_URL: ${{ secrets.BITRIX24_WEBHOOK_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
          GA4_SHEET_ID: ${{ vars.GA4_SHEET_ID }}
        run: python bitrix-pipeline/probe_type.py
