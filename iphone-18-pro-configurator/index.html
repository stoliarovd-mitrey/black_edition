<script>
(function () {
  var boot = document.getElementById('boot'), msg = document.getElementById('bootMsg'), btn = document.getElementById('bootRetry'), spin = document.getElementById('bootSpin');
  var done = false, failed = false, NET = 'The configurator could not be loaded. Check your internet connection and click “Retry”.';
  function fail(text, noRetry) { if (done || failed) return; failed = true; msg.textContent = text; spin.hidden = true; boot.classList.add('fail'); btn.hidden = !!noRetry; }
  btn.onclick = function () { location.reload(); };
  var timer = setTimeout(function () { fail('Loading is taking too long. Check your internet connection and click “Retry”.'); }, 30000);
  window.__boot = {
    NET: NET,
    step: function (text) { if (!done && !failed) msg.textContent = text; },                      // loading stage
    done: function () { if (failed) return; done = true; clearTimeout(timer); boot.hidden = true; },
    fail: fail,
    isDone: function () { return done; },
    show: function (text, label) { done = false; failed = false; boot.hidden = false; btn.textContent = label || 'Retry'; fail(text); }   // failure after loading (3D context lost)
  };
  // 3D graphics unavailable: the configurator does not start, the person gets a clear message
  var gl = null; try { var c = document.createElement('canvas'); gl = c.getContext('webgl2') || c.getContext('webgl'); } catch (e) {}
  if (!gl) { window.__noWebGL = true; fail('This browser cannot display 3D graphics, so the configurator cannot run here. Open this page in another browser (Safari, Chrome) or on another device.', true); return; }
  // until loading is complete any error of a script or a page file is a loading failure
  window.addEventListener('error', function () { fail(NET); }, true);
  window.addEventListener('unhandledrejection', function () { fail(NET); });
})();
</script>
