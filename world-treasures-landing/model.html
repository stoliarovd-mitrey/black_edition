<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#17171c">
  <title>Модель World Treasures · Caviar</title>
  <meta name="description" content="Карточка модели ювелирной коллекции World Treasures от Caviar.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,300;6..12,400;6..12,700;6..12,800&display=swap" rel="stylesheet">
  <style>
   :root{--gold:#a89974;--dark:#17171c;--paper:#f7f7f7;--ink:#393838}
   *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Nunito Sans",Arial,sans-serif}
   a{color:inherit;text-decoration:none}a:focus-visible{outline:2px solid var(--gold);outline-offset:5px}
   header{background:var(--dark);color:var(--paper);padding:22px max(5vw,24px);display:flex;align-items:center;justify-content:space-between;gap:16px}
   header .brand{font-weight:800;font-size:21px;letter-spacing:.25em}header a:last-child{font-size:13px;color:#ddd6ca}
   .item-hero{min-height:700px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);background:var(--dark);color:var(--paper);align-items:center;gap:55px;padding:64px max(5vw,24px)}
   .item-visual{min-height:550px;display:flex;align-items:center;justify-content:center;position:relative}
   .item-visual::before{content:"";position:absolute;inset:14%;background:radial-gradient(circle,rgba(168,153,116,.18),transparent 72%);pointer-events:none}
   .item-visual img{position:relative;width:85%;height:550px;object-fit:contain;filter:drop-shadow(0 18px 36px rgba(0,0,0,.36))}
   .item-copy{max-width:610px;display:flex;flex-direction:column;align-items:flex-start;gap:22px}
   .micro{color:var(--gold);font-weight:700;letter-spacing:.11em;text-transform:uppercase;font-size:12px;margin:0}
   h1,h2,p{margin:0}h1{font-size:clamp(38px,4.2vw,62px);line-height:1.05;text-transform:uppercase;letter-spacing:-.02em;font-weight:800}
   h2{font-size:clamp(30px,3vw,45px);line-height:1.13;text-transform:uppercase;letter-spacing:-.02em}
   .lead{font-weight:700;font-size:20px;line-height:1.4}.body{font-size:16px;line-height:25px;max-width:650px}
   .actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}
   .action{padding:15px 24px;border:1px solid var(--gold);font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;text-align:center;color:var(--gold);transition:background .2s,color .2s}
   .action:hover{background:var(--gold);color:#fff}.action.primary{background:var(--gold);color:#fff}.action.primary:hover{background:#968758}
   .inspiration{display:grid;grid-template-columns:1fr 1fr;gap:55px;padding:76px max(5vw,24px);background:#fff}
   .inspiration h2{max-width:550px}.inspiration-body{display:flex;flex-direction:column;gap:20px}
   .availability{padding:58px max(5vw,24px);background:var(--paper);display:flex;gap:50px;align-items:center;justify-content:space-between}
   .availability p{max-width:800px;font-size:16px;line-height:25px}
   footer{padding:35px max(5vw,24px);background:var(--dark);color:#ddd6ca;font-size:13px}
   .error{padding:10vh 6%;min-height:70vh}
   @media(max-width:760px){.item-hero{grid-template-columns:1fr;gap:18px;padding:30px 7% 55px}.item-visual{min-height:0}.item-visual img{height:380px}.item-copy{gap:17px}.inspiration{grid-template-columns:1fr;gap:22px;padding:50px 7%}.availability{padding:48px 7%;flex-direction:column;align-items:flex-start;gap:20px}.actions{width:100%}.action{width:100%}header{padding:20px 7%}}
  </style>
</head>
<body>
<header><a class="brand" href="./">CAVIAR</a><a href="./">Вернуться к коллекции</a></header>
<main id="details" aria-live="polite"><p class="error">Загружаем модель…</p></main>
<footer>WORLD TREASURES · CAVIAR</footer>
<script>
'use strict';
const routes={qasr:"Qasr Al Noor",omkara:"Omkara",dali:"Dali",jingtai:"Jingtai Blue"};
const id=new URLSearchParams(location.search).get('model');
const root=document.getElementById('details');
function node(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function addText(parent,tag,cls,text){const e=node(tag,cls,text);parent.append(e);return e}
function get(s,type){return s.items.filter(x=>x.type===type)}
async function init(){
 if(!Object.prototype.hasOwnProperty.call(routes,id)){root.replaceChildren(node('p','error','Модель не найдена. Вернитесь к коллекции.'));return}
 const response=await fetch('./content.json',{cache:'no-store'});if(!response.ok)throw Error('Не удалось загрузить карточку модели');
 const data=await response.json();const model=data.sections.find(x=>x.id===id),source=data.sections.find(x=>x.id==='inspiration-'+id);
 if(!model||!source)throw Error('Информация о модели временно недоступна');
 document.title=routes[id]+' · World Treasures · Caviar';
 const hero=node('section','item-hero'),visual=node('div','item-visual'),copy=node('div','item-copy');
 const img=node('img');img.src=get(model,'image')[0].src;img.alt=routes[id]+' — Caviar World Treasures';visual.append(img);
 addText(copy,'p','micro','World Treasures · Caviar');
 addText(copy,'h1','',routes[id]);
 const body=get(model,'text');
 for(let i=0;i<body.length;i++)addText(copy,'p',i===0?'lead':'body',body[i].text);
 const buttons=node('div','actions');
 const back=node('a','action','К коллекции');back.href='./#'+id;buttons.append(back);
 const contact=node('a','action primary','Узнать о заказе');contact.href='https://caviar-phones.ru/info/contacts/';buttons.append(contact);
 copy.append(buttons);hero.append(visual,copy);
 const inspire=node('section','inspiration'),col=node('div'),texts=node('div','inspiration-body');
 addText(col,'p','micro','Источник вдохновения');
 addText(col,'h2','',get(source,'title')[0].text);
 for(const p of get(source,'text'))addText(texts,'p','body',p.text);
 inspire.append(col,texts);
 const availability=node('section','availability'),description=node('div');
 addText(description,'p','body','Лимитированная коллекция. Qasr Al Noor, Omkara и Dali выпущены тиражом по 7 экземпляров, Jingtai Blue — 8 экземпляров. Уточните доступность у консультанта Caviar.');
 const catalog=node('a','action primary','Перейти в каталог');catalog.href='https://caviar-phones.ru/catalog/';
 availability.append(description,catalog);
 root.replaceChildren(hero,inspire,availability);
}
init().catch(e=>root.replaceChildren(node('p','error',e.message)));
</script>
</body>
</html>
