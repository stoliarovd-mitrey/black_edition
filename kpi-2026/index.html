    const normalized=secret.replace(/-/g,'+').replace(/_/g,'/')+'=';
    const raw=bytes(normalized);
    if(raw.length!==32)throw new Error('invalid key');
    const cryptoKey=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
    const enc=bytes(payload);
    const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:enc.slice(0,12),additionalData:new TextEncoder().encode('caviar-kpi-2026-report-v1')},cryptoKey,enc.slice(12));
    const report=new TextDecoder().decode(plain);
    const frame=document.getElementById('viewer');
    frame.srcdoc=report;
    document.getElementById('lock').style.display='none';
    frame.style.display='block';
  }catch(e){status.textContent='Неверная ссылка или ключ доступа. Запросите оригинальную ссылку на отчёт.';}
})();
